<!-- Plantilla MINIMALISTA
     Compatibilidad con Outlook/Gmail/Apple Mail/Thunderbird: solo tablas y
     estilos inline, sin CSS externo ni flexbox/grid (los clientes de correo
     no los soportan de forma fiable). -->
<table cellpadding="0" cellspacing="0" border="0" style="font-family: Arial, Helvetica, sans-serif; color:#1B1C1E;">
  <tr>
    <td style="padding-right:14px; border-right:2px solid #33406B;">
      <div style="font-size:16px; font-weight:bold; color:#1B1C1E;">{{nombre}}</div>
      <div style="font-size:13px; color:#6F6F6C;">{{cargo}}</div>
    </td>
    <td style="padding-left:14px; font-size:12px; color:#6F6F6C; line-height:1.6;">
      <div>{{empresa}}</div>
      <div>{{telefono}} &nbsp;·&nbsp; <a href="mailto:{{correo}}" style="color:#33406B; text-decoration:none;">{{correo}}</a></div>
      <div><a href="{{web}}" style="color:#33406B; text-decoration:none;">{{web}}</a> &nbsp; {{redes}}</div>
      <div style="margin-top:4px;">{{campos_personalizados}}</div>
    </td>
  </tr>
</table>

<style>
  /* Solo para la vista previa dentro de la app; se ignora al pegar en un correo real. */
  body { margin: 16px; }
  .cf-row { margin-top: 2px; }
  .cf-label { color:#6F6F6C; }
  .social-link { margin-right: 8px; color:#33406B; text-decoration:none; }
</style>
